<section class="fp" data-concept="replica">
  <div class="fp-problem"><h3>Problem</h3><p>A node can stop.</p></div>
  <div class="fp-buildup"><h3>Build-up</h3><p>If one node stops, the other node keeps the data.</p></div>
  <div class="fp-truths"><h3>Ground truths</h3><p>A node can stop at any time.</p></div>
  <div class="fp-name"><h3>Name</h3><p>This copy is a replica.</p></div>
  <div class="fp-test"><h3>Foundation test</h3><p>If a node does not stop, you do not need a replica.</p></div>
</section>
