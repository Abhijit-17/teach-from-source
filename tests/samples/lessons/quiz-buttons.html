<div class="quiz" id="q1" data-answer="a">
  <p class="q">1. Which object keeps a copy of the data?</p>
  <button data-key="a">A replica that keeps a copy of the data on one node</button>
  <button data-key="b">The leader that sends the new value to each replica</button>
  <button data-key="c">A node that can stop at any time and keeps no data</button>
  <div class="explain">A replica keeps a copy of the data <a class="cite" href="#">p. 12</a>.</div>
